<!DOCTYPE html>
<!--
  AULA 4 - Operadores aritméticos (revisão e precedência)
  OBJETIVO: praticar +, -, *, / e a ordem das operações (mesmo conteúdo do 01.html).
  CONCEITOS-CHAVE: operadores aritméticos, precedência, parênteses.
  COMO TESTAR: a linha com a, b e c e depois 30, -10, 200, 0.5, 0.25 e 5.
  VEJA TAMBÉM: 01.html (primeira versão), 16.html (atribuição composta), 18.html (resto e incremento).
-->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tópico 4</title>
    </head>
    <body>
        <div>Programação de Interfaces (aula 4)</div>
        <script type="text/javascript">
            // Define valores iniciais.
            var a = 10, b = 20, c = 30;

            /*
             * Tabela de operadores aritméticos (com a = 10 e b = 20):
             * +   soma              a + b   ->  30
             * -   subtração         a - b   ->  -10
             * *   multiplicação     a * b   ->  200
             * /   divisão           a / b   ->  0.5
             * %   resto da divisão  20 % 6  ->  2       (veja 18.html)
             * **  potência          2 ** 3  ->  8       (equivale a Math.pow(2, 3); veja 42.html)
             * Ordem: primeiro parênteses, depois multiplicação, divisão e resto, por fim soma e subtração.
             * Em caso de empate, da esquerda para a direita.
             * EXEMPLO: 2 + 3 * 4  ->  14       (2 + 3) * 4  ->  20       20 / 5 * 2  ->  8
             */
            var somar = a + b;
            var subtrair = a - b;
            var mult = a * b;
            var dividir = a/b;
            
            // Exibe os resultados na página.
            document.write("<br>a =  " + a + " | b = " + b + " | c = " + c + "<br>");     
            document.write("<br>Somar (a+b) =  " + somar );     
            document.write("<br>Subtrair (a-b) =  " + subtrair );     
            document.write("<br>Multiplicar (a*b) =  " + mult );     
            document.write("<br>Dividir (a/b) =  " + dividir );     
            document.write("<br>(a/(a+c)) =  " + a/(a+c) );
            document.write("<br>(b*a) /(a+c) =  " + (b*a)/(a+c) );
        </script>
    </body>
</html>
