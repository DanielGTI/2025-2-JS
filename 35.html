<!DOCTYPE html>
<!--
    ARQUIVO: 35.html
    AULA / TEMA: aula 8 - Recursão (função que chama a si mesma): fatorial
    OBJETIVO: entender como uma função pode resolver um problema chamando a
              si própria com um problema menor, até chegar a um caso simples.
    CONCEITOS-CHAVE: recursão, caso base, chamada recursiva, pilha de chamadas.
    COMO TESTAR: abra a página. Aparecem os fatoriais de 1 a 5:
                 1, 2, 6, 24 e 120.
-->
<html>
    <head>
        <title>Tópico 7</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <div>Programação de Interfaces (aula 8)</div>
        <script type="text/javascript">
            /*
              FATORIAL de n (n!) = n * (n-1) * (n-2) * ... * 1        EXEMPLO: 5! = 5*4*3*2*1 = 120
              Ideia recursiva: n! = n * (n-1)!   e as paradas são 0! = 1 e 1! = 1.

              Toda recursão precisa de duas partes:
                1) CASO BASE: quando parar de chamar (aqui, n igual a 0 ou 1);
                2) CHAMADA RECURSIVA: a função chama a si mesma com um valor MENOR.

              Trace de fatorial(3):
                fatorial(3) = 3 * fatorial(2)
                                  fatorial(2) = 2 * fatorial(1)
                                                    fatorial(1) = 1          <- caso base
                                  fatorial(2) = 2 * 1 = 2
                fatorial(3) = 3 * 2 = 6
              Cada chamada fica "esperando" na pilha até a de baixo responder.

              NA PROVA: sem caso base (ou com n negativo, como fatorial(-1)) a função nunca
              para e o navegador acusa "RangeError: Maximum call stack size exceeded".
              Versão sem recursão (com laço), para comparar:
                  var r = 1;
                  for (var i = 2; i <= n; i++) { r *= i; }
            */
            function fatorial(n){
                // Caso base: 0! e 1! são iguais a 1. É o que impede a recursão de rodar para sempre.
                if ((n == 0) || (n == 1))
                    return 1;
                else
                    // Chamada recursiva: n * fatorial(n - 1). O argumento diminui a cada volta (4, 3, 2, 1)
                    // até cair no caso base. Só depois as multiplicações pendentes são resolvidas.
                    return (n * fatorial(n - 1));
            }

            // Resultados esperados:  1! = 1 | 2! = 2 | 3! = 6 | 4! = 24 | 5! = 120
            document.write("<br>Fatorial(1) = " + fatorial(1));
            document.write("<br>Fatorial(2) = " + fatorial(2));
            document.write("<br>Fatorial(3) = " + fatorial(3));
            document.write("<br>Fatorial(4) = " + fatorial(4));
            document.write("<br>Fatorial(5) = " + fatorial(5));

        </script>
    </body>
</html>
