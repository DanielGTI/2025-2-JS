<!DOCTYPE html>
<html>
    <head>
        <title>Tópico 7</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <script type="text/javascript">
            // Controla se o truque de "sumir" já aconteceu.
            var magica = false;

            // Altera o estado do baú (abrir, fechar ou sumir).
            function alterar_Bau(x){
                var img_bau;
                if (x == 1 && magica == false)
                    img_bau = "bau_aberto.png";                    
                else 
                    if (x == 2 && magica == false)
                        img_bau = "bau_fechado.png"
                    else{
                        // Clique: remove a imagem e ativa o modo mágico.
                        img_bau = "";
                        magica = true;
                    }
                document.getElementById("bau").src = img_bau;
            }            
        </script>
    <img src="bau_fechado.png" id="bau" onMouseOver="alterar_Bau(1)" onMouseOut="alterar_Bau(2)" onClick="alterar_Bau(0)">
        
    </body>
</html>
