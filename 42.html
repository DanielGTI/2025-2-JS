<!DOCTYPE html>
<!--
    ARQUIVO: 42.html
    AULA / TEMA: aula 11 - Objeto Math (funções matemáticas prontas)
    OBJETIVO: usar arredondamentos, potência, raiz, mínimo/máximo e números aleatórios.
    CONCEITOS-CHAVE: Math.round/ceil/floor, pow, sqrt, abs, min, max, random, PI.
    COMO TESTAR: abra a página. Cada linha mostra o resultado de um método (veja os
                 comentários "Resposta" ao lado de cada linha). O valor de Math.random()
                 muda a cada vez que a página é recarregada.
-->
<html>
    <head>
        <title>Tópico 7</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <div>Programação de Interfaces (aula 11)</div>
        <script>
            /*
              Math é um objeto PRONTO do JavaScript: não se usa new, chama-se direto (Math.sqrt(9)).
              Quase tudo aqui devolve um número; os métodos NÃO alteram o valor que você passou.
              Arredondamentos (compare):                  3.2   3.5   3.8   -4.3
                  Math.round (mais próximo)               3     4     4     -4
                  Math.ceil  (para CIMA)                  4     4     4     -4
                  Math.floor (para BAIXO)                 3     3     3     -5
            */
            document.write("<br> " + Math.PI);                  // Resposta: 3.141592653589793
            // Cada linha abaixo traz, no comentário final, o valor esperado.
            // Obs.: pow(3,2) é 3 elevado a 2 (= 9); forma moderna: 3 ** 2.
            // Obs.: Math.sqrt de número negativo dá NaN (not a number):  Math.sqrt(-1)  ->  NaN
            // Obs.: Math.min/Math.max aceitam vários valores; com um array use o spread: Math.max(...lista).
            document.write("<br> " + Math.round(3.14159));      // Resposta: 3
            document.write("<br> " + Math.pow(3,2));            // Resposta: 9
            document.write("<br> " + Math.sqrt(9));             // Resposta: 3
            document.write("<br> " + Math.abs(-56.351));        // Resposta: 56.351
            document.write("<br> " + Math.ceil(4.3));           // Resposta: 5
            document.write("<br> " + Math.floor(4.8));          // Resposta: 4
            document.write("<br> " + Math.min(2,8,6,4,8,1));    // Resposta: 1
            document.write("<br> " + Math.max(2,8,6,4,8,1));    // Resposta: 8
            document.write("<br> " + Math.random());            // Resposta: (número real entre 0 e 1)
            /*
              Math.random() devolve um número decimal de 0 (incluído) até 1 (NÃO incluído).
              RECEITA PARA NA PROVA: número inteiro ALEATÓRIO entre min e max (inclusive):
                  Math.floor(Math.random() * (max - min + 1)) + min
              EXEMPLO: dado de 6 faces (1 a 6):   Math.floor(Math.random() * 6) + 1
                Trace: random = 0.0   ->  0.0 * 6 = 0.0   ->  floor = 0  ->  +1 = 1
                       random = 0.999 ->  0.999 * 6 = 5.99 ->  floor = 5  ->  +1 = 6
              Formatar casas decimais (devolve TEXTO):  (3.14159).toFixed(2)  ->  "3.14"
            */
        </script>

    </body>
</html>
