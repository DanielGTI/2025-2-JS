<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tópico 6</title>
    </head>
    <body>
        <div>Programação de Interfaces (aula 6)</div>
        <script type="text/javascript">
            // Contador inicial.
            var x = 1;

            // Repete enquanto a condição for verdadeira.
            while(x <= 10){
                document.write("<br> Contagem:  " + x);
                x++;
            }        
        </script>
    </body>
</html>
