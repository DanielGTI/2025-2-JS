<body>

    <script>
        // Função construtora do objeto Carro.
        function Carro(a, b, c, d){
            this.cor = a;
            this.ano = b;
            this.portas = c;
            this.modelo = d;
            this.velocidadeAtual = 0;
            this.ligado = false;
        }
 
        // Liga o carro e define velocidade inicial.
        Carro.prototype.passear = function(){
            this.ligado = true;
            this.velocidadeAtual = 50;
            return this.velocidadeAtual;
        }
 
        // Para o carro.
        Carro.prototype.parar = function(){
            this.velocidadeAtual = 0;
        }
 
        // Estaciona: para e desliga o carro.
        Carro.prototype.estacionar = function(){
            this.parar();
            this.ligado = false;
        }
 
        // Aumenta a velocidade em 10 km/h.
        Carro.prototype.acelerar = function(){
            this.velocidadeAtual += 10;
        }
 
        // Retorna um texto com o estado atual do carro.
        Carro.prototype.informacao = function(){
            if(this.ligado) 
                var motorLigado = 'ligado';
            else
                var motorLigado = 'desligado';
 
            return 'Velocidade atual = ' + this.velocidadeAtual + ' km/h,' + 
            ' o meu ' + this.modelo + ' ' + this.cor + ' está ' + motorLigado + '.';
 
        }
 
        // Cria um objeto a partir da função construtora.
        var veiculo1 = new Carro('preto', 2017, 5, 'SUV');
 
        // Executa ações e mostra os resultados no console.
        console.log(veiculo1.informacao());
        veiculo1.passear();
 
        console.log(veiculo1.informacao());
        veiculo1.parar();
        console.log(veiculo1.informacao());
        veiculo1.passear();
        console.log(veiculo1.informacao());
        veiculo1.estacionar();
        console.log(veiculo1.informacao());
        veiculo1.passear();
        veiculo1.acelerar();
        veiculo1.acelerar();
        console.log(veiculo1.informacao());
   
   </script>
</body>
</html>
